<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Edit Task</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        /* Custom CSS to center the form */
        .center-form {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .form-container {
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="center-form">
        <div class="form-container">
            <form th:action="@{/tasks/{id}(id=${task.id})}" th:object="${task}" method="post" class="shadow p-5">
                <h1 class="mb-4 text-center">Edit Task</h1>
                <div class="form-group">
                    <input type="text" class="form-control" id="title" th:field="*{title}" placeholder="Title" required>
                </div>
                <div class="form-group">
                    <textarea rows="5" class="form-control" id="description" th:field="*{description}" name="description" placeholder="Description" required></textarea>
                </div>
                <div class="form-group form-check">
                    <input type="checkbox" class="form-check-input" id="completed" th:field="*{completed}">
                    <label class="form-check-label" for="completed">Completed</label>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Update</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
